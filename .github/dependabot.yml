# Dependabot configuration for StellarPay
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  # Soroban (Rust) workspace
  - package-ecosystem: "cargo"
    directory: "/contracts"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      soroban:
        patterns: ["soroban-sdk*", "stellar-asset-sdk*", "soroban-token-sdk*"]
    commit-message:
      prefix: "deps(stellar)"
    open-pull-requests-limit: 5

  # Off-chain services + frontend (npm workspaces live at the root)
  - package-ecosystem: "npm"
    directory: "/api"
    schedule: { interval: "weekly", day: "monday" }
    commit-message: { prefix: "deps(api)" }
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/bridge"
    schedule: { interval: "weekly", day: "monday" }
    commit-message: { prefix: "deps(bridge)" }
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/indexer"
    schedule: { interval: "weekly", day: "monday" }
    commit-message: { prefix: "deps(indexer)" }
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/relayer"
    schedule: { interval: "weekly", day: "monday" }
    commit-message: { prefix: "deps(relayer)" }
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/sdk"
    schedule: { interval: "weekly", day: "monday" }
    commit-message: { prefix: "deps(sdk)" }
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule: { interval: "weekly", day: "monday" }
    groups:
      next:
        patterns: ["next", "eslint-config-next"]
    commit-message: { prefix: "deps(frontend)" }
    open-pull-requests-limit: 5

  # EVM contracts
  - package-ecosystem: "npm"
    directory: "/contracts"
    schedule: { interval: "weekly", day: "monday" }
    groups:
      openzeppelin:
        patterns: ["@openzeppelin/*"]
    commit-message: { prefix: "deps(evm)" }
    open-pull-requests-limit: 5
    # These majors require a coordinated migration (Hardhat 3 is ESM-only,
    # TypeScript 7 is the native Go compiler, hardhat-upgrades 4 / toolbox 7
    # target Hardhat 3). Keep them pinned until that migration is done so
    # weekly bump PRs don't silently break the EVM contracts CI again.
    ignore:
      - dependency-name: "hardhat"
        versions: [">=3.0.0"]
      - dependency-name: "@nomicfoundation/hardhat-toolbox"
        versions: [">=6.0.0"]
      - dependency-name: "@openzeppelin/hardhat-upgrades"
        versions: [">=4.0.0"]
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
      - dependency-name: "dotenv"
        versions: [">=17.0.0"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    commit-message: { prefix: "ci" }
    open-pull-requests-limit: 3
