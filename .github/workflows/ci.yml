name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Node 22 LTS: the api tests pull in undici 8 (via testcontainers), which
  # requires Node >= 22.5 (webidl.util.markAsUncloneable).
  NODE_VERSION: 22

jobs:
  # ─── Lint all non-code files ───
  lint-configs:
    name: Lint config files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      # Install the workspace so `pnpm exec prettier` resolves the
      # lockfile-pinned version (3.9.6). A bare `npx prettier` without
      # node_modules would fetch the latest prettier from the registry,
      # making formatting checks non-deterministic across runs.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check "**/*.{json,md,yml,yaml}" "!**/node_modules/**" "!**/dist/**" "!**/target/**"

  # ─── Soroban contracts ───
  soroban-contracts:
    name: Soroban contracts
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ./contracts } }
    steps:
      - uses: actions/checkout@v7
      # soroban-sdk 27 has MSRV 1.91 and its build.rs rejects the
      # `wasm32-unknown-unknown` target on Rust 1.82+ (reference-types /
      # multi-value features), requiring `wasm32v1-none` instead.
      # See `contracts/BUILD_ENV_NOTES.md`. Pinned to the MSRV for
      # deterministic builds (matches clippy.toml msrv).
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: wasm32v1-none
          # Block style is required: the action's `components` input takes a
          # single comma-separated string, and flow-style `with: { ...
          # components: rustfmt, clippy }` made GitHub parse `clippy` as a
          # separate input key, so the clippy component was never installed.
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "./contracts", shared-key: "soroban" }
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked --target wasm32v1-none --release
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # ─── EVM contracts (standalone npm package, not in the pnpm workspace) ───
  evm-contracts:
    name: EVM contracts
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ./contracts } }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          {
            node-version: "${{ env.NODE_VERSION }}",
            cache: npm,
            cache-dependency-path: contracts/package-lock.json,
          }
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            contracts/cache
            contracts/artifacts
          key: hardhat-${{ hashFiles('contracts/package-lock.json') }}
      - run: npx hardhat compile
      - run: npx hardhat test
      - name: Slither static analysis
        uses: crytic/slither-action@v0.4.2
        with:
          target: contracts
          solc-version: 0.8.24
          # Pin Slither for deterministic runs: when `slither-version` is
          # unset the action installs `slither-analyzer` at the latest PyPI
          # release, so a future release could change finding severities and
          # trip --fail-low. Must stay <= 0.11.4: the action image is
          # python:3.9 and slither-analyzer 0.11.5+ requires Python >=3.10
          # (pip fails with "No matching distribution found").
          slither-version: 0.11.4
          # The action appends its own --fail flag from the `fail-on` input
          # (default `all` -> --fail-pedantic). Passing --fail-low via
          # slither-args as well made slither reject the step (the --fail-*
          # flags are mutually exclusive). `low` fails the job only on
          # low-severity+ findings; the informational naming-convention
          # findings pass through.
          fail-on: low
          slither-args: --filter-paths "node_modules|openzeppelin"

  # ─── TypeScript services (pnpm workspace) ───
  ts-services:
    name: TS services (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [bridge, relayer, indexer, api, sdk]
        include:
          - service: bridge
            prisma: true
          - service: relayer
            prisma: true
          - service: indexer
            prisma: true
          - service: api
            prisma: true
          - service: sdk
            prisma: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - if: matrix.prisma
        run: pnpm --filter "@stellar-payment-gateway/${{ matrix.service }}" exec prisma generate
      - run: pnpm --filter "@stellar-payment-gateway/${{ matrix.service }}" exec tsc --noEmit
      - run: pnpm --filter "@stellar-payment-gateway/${{ matrix.service }}" test
      - name: Audit (non-blocking, workspace-wide)
        # pnpm audit does not support --filter; run it once at the workspace
        # root and treat as advisory. The api package still reports
        # devDep-only findings (testcontainers/vitest chains) that require
        # breaking major upgrades. Tracked in docs/audit-checklist.md.
        # Re-enable as a blocking gate once the dependency upgrades land.
        run: pnpm audit --audit-level=high || true

  # ─── Frontend ───
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # @stellar-payment-gateway/dashboard depends on @stellar-payment-gateway/sdk via `workspace:*`;
      # the SDK's `main` points at `dist/index.js`, so it must be built
      # before the frontend can resolve/transpile it.
      - run: pnpm --filter "@stellar-payment-gateway/sdk" build
      - run: pnpm --filter "@stellar-payment-gateway/dashboard" exec tsc --noEmit
      - run: pnpm --filter "@stellar-payment-gateway/dashboard" test
      - run: pnpm --filter "@stellar-payment-gateway/dashboard" exec next lint
      - name: Build
        run: pnpm --filter "@stellar-payment-gateway/dashboard" build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_STELLAR_CONTROLLER: "CABC"
