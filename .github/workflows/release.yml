name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v5
        with: { node-version: 22, registry-url: https://registry.npmjs.org }
      - name: Build & publish SDK
        run: |
          pnpm install --frozen-lockfile
          cd sdk
          pnpm build
          # Tag-push checkouts have a detached HEAD, so pnpm's default
          # git-checks (which require being on master|main) would fail.
          pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Build & push container images
        run: |
          REGISTRY=ghcr.io/stellar-payment-gateway TAG=${GITHUB_REF_NAME} ./scripts/build-images.sh
