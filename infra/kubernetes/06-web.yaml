apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: spg }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: web
          image: spg/web:latest
          env:
            # PLACEHOLDER: no hosted API exists yet (api.spg.xyz has no DNS
            # record). Point this at the real API origin once it is deployed.
            - name: NEXT_PUBLIC_API_URL
              value: https://api.spg.xyz
            - name: NEXT_PUBLIC_STELLAR_RPC
              value: https://horizon.stellar.org
            - name: NEXT_PUBLIC_STELLAR_CONTROLLER
              value: "C..."
          ports: [{ containerPort: 3000 }]
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: spg }
spec:
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 3000 }]
