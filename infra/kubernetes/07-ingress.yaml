# NOTE: `spg.xyz` / `api.spg.xyz` are PLACEHOLDERS. This project does not
# control that domain today (it resolves to an unrelated third-party site) and
# no DNS record exists for `app.spg.xyz`. Replace the hosts below with a
# domain the project actually controls before applying this manifest, and only
# after the DNS + TLS records exist. See DEPLOYMENTS.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spg
  namespace: spg
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [spg.xyz, api.spg.xyz]
      secretName: spg-tls
  rules:
    - host: spg.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
    - host: api.spg.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: api, port: { number: 80 } } }
