<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F2E"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- soft glow -->
  <circle cx="256" cy="256" r="220" fill="url(#glow)"/>

  <!-- orbit ring connecting cross-chain nodes -->
  <circle cx="256" cy="256" r="182" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.55" stroke-dasharray="2 10" stroke-linecap="round"/>

  <!-- chain nodes on the orbit -->
  <circle cx="256" cy="74" r="9" fill="url(#goldGrad)"/>
  <circle cx="413" cy="345" r="9" fill="url(#goldGrad)"/>
  <circle cx="99" cy="345" r="9" fill="url(#goldGrad)"/>

  <!-- thin bridging lines from nodes toward the star -->
  <line x1="256" y1="83" x2="256" y2="150" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>
  <line x1="404" y1="339" x2="336" y2="298" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>
  <line x1="108" y1="339" x2="176" y2="298" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.6" stroke-linecap="round"/>

  <!-- central four-point stellar mark -->
  <path d="M256,96 C280,180 332,232 416,256 C332,280 280,332 256,416 C232,332 180,280 96,256 C180,232 232,180 256,96 Z"
        fill="url(#starGrad)"/>

  <!-- small inner highlight -->
  <circle cx="256" cy="256" r="14" fill="#F8FAFC" fill-opacity="0.9"/>
</svg>
