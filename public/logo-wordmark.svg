<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B5EA7"/>
      <stop offset="50%" style="stop-color:#5B3E96"/>
      <stop offset="100%" style="stop-color:#3A1F78"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7B5EA7"/>
      <stop offset="100%" style="stop-color:#4A90D9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Stellar-inspired star icon -->
  <g transform="translate(60, 60)">
    <!-- Outer glow ring -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#star-grad)" stroke-width="1.5" opacity="0.3"/>

    <!-- Stellar-style 4-point star -->
    <polygon
      points="0,-35 12,-8 35,0 12,8 0,35 -12,8 -35,0 -12,-8"
      fill="url(#star-grad)"
      stroke="#4A2A8A"
      stroke-width="1.5"
      stroke-linejoin="round"
      filter="url(#glow)"
    />

    <!-- Center circle -->
    <circle cx="0" cy="0" r="6" fill="#4A90D9" opacity="0.9"/>
    <circle cx="0" cy="0" r="3" fill="#fff" opacity="0.6"/>
  </g>

  <!-- Text: StellarPay -->
  <g transform="translate(120, 50)">
    <text
      font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif"
      font-size="36"
      font-weight="700"
      fill="url(#text-grad)"
      letter-spacing="-0.5"
    >StellarPay</text>
  </g>

  <!-- Tagline -->
  <g transform="translate(120, 72)">
    <text
      font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif"
      font-size="12"
      font-weight="500"
      fill="#8892B0"
      letter-spacing="2"
    >DECENTRALIZED LENDING PROTOCOL</text>
  </g>
</svg>
